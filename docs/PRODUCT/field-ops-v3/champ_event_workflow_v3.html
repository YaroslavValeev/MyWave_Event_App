function assignJudges(){for(const j of judges)j.load=0;for(const h of heats){const eligible=judges.filter(j=>!j.conflict.includes(h.id)).sort((a,b)=>a.load-b.load||b.level-a.level);h.assigned=eligible.slice(0,3).map(x=>x.id);eligible.slice(0,3).forEach(j=>j.load++);}state.judgeProposal=true;state.judgeApproved=false;render();toast('Предложение построено. Требуется проверка главным судьёй.')}

function speech(){const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){toast('Голосовой ввод недоступен в этом браузере. Используйте поле комментария.');return}const sr=new Rec();sr.lang='ru-RU';sr.interimResults=false;sr.onresult=e=>{state.notes=((document.getElementById('judgeNote')?.value||'')+' '+e.results[0][0].transcript).trim();render();toast('Расшифровка получена. Проверьте текст вручную.')};sr.onerror=e=>toast('Микрофон: '+e.error+'. Можно ввести текст вручную.');try{sr.start();toast('Микрофон включён. Расскажите о проезде.')}catch(e){toast('Не удалось запустить распознавание речи')}}
const main=document.getElementById('main');
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return; if(target.id==='roleBtn'){state.page='welcome';state.role=null;location.hash='';render();return}if(target.dataset.role){selectRole(target.dataset.role);return}if(target.dataset.go){pageNav(target.dataset.go);return}if(target.dataset.selectHeat){state.selectedHeat=target.dataset.selectHeat;state.scores={};state.scoreSaved=false;render();return}if(target.dataset.med){state.medChecked[target.dataset.med]=!state.medChecked[target.dataset.med];render();return}if(target.dataset.report){state.report=target.dataset.report;render();return}if(target.dataset.editCategory){const c=categories.find(x=>x.id===+target.dataset.editCategory);const ed=document.getElementById('categoryEditor');ed.innerHTML=`<h3>Редактировать учебную категорию</h3><label class="field"><span class="label">Название</span><input id="catName" value="${escapeHtml(c.title)}"></label><label class="field" style="margin:12px 0"><span class="label">Код категории</span><input id="catCode" value="${escapeHtml(c.code)}"></label><button class="btn" data-save-category="${c.id}">Сохранить в демо</button><p class="muted" style="margin:10px 0 0;font-size:12px">На сервер ничего не отправляется.</p>`;ed.scrollIntoView({behavior:'smooth',block:'center'});return}if(target.dataset.saveCategory){const c=categories.find(x=>x.id===+target.dataset.saveCategory);const title=document.getElementById('catName').value.trim(),code=document.getElementById('catCode').value.trim();if(!title||!code){toast('Заполните название и код категории');return}c.title=title;c.code=code;render();toast('Учебная категория изменена');return}if(target.dataset.scoreStep){const key=target.dataset.scoreStep,prev=Number(state.scores[key]||0),next=Math.min(10,Math.max(0,Math.round((prev+Number(target.dataset.delta))*10)/10));state.scores[key]=String(next);state.scoreSaved=false;render();const el=document.querySelector(`[data-score="${key}"]`);el?.focus();return}switch(target.dataset.action){case 'no-files':toast('Для скачивания нужен реальный файл из API. Демо не подменяет документы.');break;case 'assign':assignJudges();break;case 'approve-judges':if(heats.some(h=>h.assigned.length<3))return toast('Нельзя утвердить: недостаточно судей в одном из заездов');state.judgeApproved=true;state.done.judges=true;render();toast('Демо-предложение утверждено локально');break;case 'seed':generateSeed();break;case 'training':generateTraining();break;case 'advance-heat':{const h=heats.find(x=>x.id===state.selectedHeat),seq=['запланирован','готов','на воде','завершён'],pos=seq.indexOf(h.status);if(pos>=0&&pos<seq.length-1){h.status=seq[pos+1];render();toast('Учебный статус изменён локально')}else toast('Заезд завершён');break}case 'save-score':saveScore();break;case 'voice':speech();break;case 'parse-voice':parseVoice();break;case 'save-protocol':if(!state.protocolFile)return toast('Сначала выберите файл');state.protocolSaved=true;render();toast('Черновик создан в памяти страницы');break;case 'report-preview':toast('В реальном приложении здесь откроется предпросмотр выбранного отчёта с проверкой данных');break;case 'approve-results':state.resultsApproved=!state.resultsApproved;render();break;case 'print':if(state.resultsApproved)window.print();else toast('Печать доступна после подтверждения');break;default:break}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.score){state.scores[el.dataset.score]=el.value;state.scoreSaved=false}if(el.id==='judgeNote')state.notes=el.value});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='seedCategory'){state.category=+el.value;state.seedPreview=null;render()}if(el.id==='protocolHeat'){state.selectedHeat=el.value}if(el.id==='certificateName'){state.certificateName=el.value;state.certificatePlace=String(persons.slice(0,3).findIndex(p=>p.name===el.value)+1);render()}if(el.id==='protocolCamera'||el.id==='protocolFile'){const f=el.files?.[0];if(!f)return;state.protocolFile=f.name;state.protocolImage=null;if(f.type.startsWith('image/')){const reader=new FileReader();reader.onload=()=>{state.protocolImage=reader.result;render()};reader.readAsDataURL(f)}else render()}if(el.id==='certificateFile'){const f=el.files?.[0];if(f&&!['image/png','image/jpeg'].includes(f.type))return toast('Разрешены только JPG или PNG');if(f){const reader=new FileReader();reader.onload=()=>{state.certificateImage=reader.result;render()};reader.readAsDataURL(f)}}});
render();
</script>
