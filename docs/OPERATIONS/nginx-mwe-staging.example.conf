# Example nginx site for MyWave Event App staging behind already-open :80/:443.
# Replace event-staging.example.com with your DNS A-record → VPS IP.
# Do NOT replace the main Site_MyWave vhost blindly — add a separate server_name.
#
# Install (Debian/Ubuntu):
#   cp docs/OPERATIONS/nginx-mwe-staging.example.conf /etc/nginx/sites-available/mwe-staging
#   ln -sf /etc/nginx/sites-available/mwe-staging /etc/nginx/sites-enabled/mwe-staging
#   nginx -t && systemctl reload nginx
#
# Then set in .env.staging (and rebuild web — NEXT_PUBLIC_* baked at build):
#   NEXT_PUBLIC_API_BASE_URL=https://event-staging.example.com
#   API_PUBLIC_URL=https://event-staging.example.com
#   PUBLIC_WEB_URL=https://event-staging.example.com
#   CORS_ORIGINS=https://event-staging.example.com
#
# Client calls: {BASE}/api/v1/... and {BASE}/health

server {
    listen 80;
    server_name event-staging.example.com;

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
