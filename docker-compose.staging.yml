# Staging stack — MyWave Event App
# Usage:
#   copy .env.staging.example → .env.staging
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up --build -d
#
# Ports: API 8001, Web 3001 (avoid clash with local npm run dev).

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: mwe-staging-api
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/mywave_event_staging.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3001,http://localhost:3001}
      ENABLE_AUDIT_LOG: "1"
    volumes:
      - staging_api_data:/data
    ports:
      - "8001:8000"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: mwe-staging-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8001}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MyWave Event App (Staging)}
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    command: npm run start -- --hostname 0.0.0.0 --port 3000
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: mwe-staging-postgres
    environment:
      POSTGRES_DB: mywave_event_staging
      POSTGRES_USER: mywave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mywave-staging-change-me}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mywave -d mywave_event_staging"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  staging_api_data:
  staging_pg_data:
